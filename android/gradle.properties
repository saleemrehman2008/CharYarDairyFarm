org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# Kotlin's incremental compilation keeps a set of .tab index files under
# build/. On this machine they cannot be closed — every release build fails
# with "Could not close incremental caches", on a clean tree as well as a
# dirty one, which points at the file being held open from outside Gradle
# rather than at anything left behind. A release build compiles every module
# once anyway, so the caches buy nothing here.
kotlin.incremental=false
