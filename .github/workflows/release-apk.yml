name: Build release APK

# Every push to main produces a signed APK and attaches it to a GitHub Release,
# which is where the co-founders install the app from.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  FLUTTER_VERSION: 3.47.3
  JAVA_VERSION: '17'

jobs:
  analyze:
    name: Analyze & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Fetch packages
        run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test --no-test-assets

  functions:
    name: Type-check Cloud Functions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - run: npm ci
        working-directory: functions

      - run: npm run build
        working-directory: functions

  release:
    name: Signed APK
    needs: [analyze, functions]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # google-services.json is kept out of this public repo and injected here.
      - name: Write google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "::error::Secret GOOGLE_SERVICES_JSON is not set. Add the base64 of android/app/google-services.json to the repository secrets (see SETUP.md)."
            exit 1
          fi
          mkdir -p android/app
          echo "$GOOGLE_SERVICES_JSON" | base64 -d > android/app/google-services.json
          python3 -c "import json,sys; json.load(open('android/app/google-services.json'))"

      - name: Write the upload keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Secret KEYSTORE_BASE64 is not set (see SETUP.md)."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/upload-keystore.jks
          cat > android/key.properties <<EOF
          storeFile=../upload-keystore.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Fetch packages
        run: flutter pub get

      # Two builds, because one file cannot be both small and universal.
      #
      # A single APK has to carry the engine three times over — 64-bit, 32-bit
      # and the emulator's — and the phone it lands on uses one of them. The
      # split build is a third of the size and is what everybody should be
      # installing. The universal one stays as the fallback for a phone too old
      # to take the 64-bit file, which is rare but not nothing.
      - name: Build APKs
        run: |
          BN=${{ github.run_number }}
          flutter build apk --release --split-per-abi --build-number="$BN"
          flutter build apk --release --build-number="$BN"

      - name: Name the artefact
        id: name
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: *//' | cut -d'+' -f1)
          TAG="v${VERSION}+${{ github.run_number }}"
          OUT=build/app/outputs/flutter-apk
          APK="char-yar-dairy-farm-${TAG}.apk"
          OLD="char-yar-dairy-farm-${TAG}-any-phone.apk"
          cp "$OUT/app-arm64-v8a-release.apk" "$APK"
          cp "$OUT/app-release.apk" "$OLD"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "apk=$APK" >> "$GITHUB_OUTPUT"
          echo "old=$OLD" >> "$GITHUB_OUTPUT"
          du -h "$APK" "$OLD"

      - uses: actions/upload-artifact@v7
        with:
          name: release-apk
          path: |
            ${{ steps.name.outputs.apk }}
            ${{ steps.name.outputs.old }}

      - name: Publish the Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.name.outputs.tag }}
          name: Char Yar Dairy Farm ${{ steps.name.outputs.tag }}
          body: |
            Install **char-yar-dairy-farm-${{ steps.name.outputs.tag }}.apk**
            on an Android phone. It is the small one and it is the right one
            for any phone made since about 2017.

            The file ending in **-any-phone.apk** is three times the size and
            is only there for a phone too old to install the other one.

            Commit: ${{ github.sha }}
          files: |
            ${{ steps.name.outputs.apk }}
            ${{ steps.name.outputs.old }}
          fail_on_unmatched_files: true

      - name: Clean up secrets on disk
        if: always()
        run: rm -f android/upload-keystore.jks android/key.properties
