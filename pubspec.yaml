name: char_yar_dairy_farm
description: Char Yar Dairy Farm — sales, accounts, orders and monthly profit sharing for a four-partner dairy farm.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.9.0 <4.0.0"
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^4.14.0
  firebase_auth: ^6.6.1
  cloud_firestore: ^6.9.0
  firebase_storage: ^13.5.0
  firebase_messaging: ^16.6.0
  cloud_functions: ^6.4.0
  google_sign_in: ^7.2.0

  # App
  provider: ^6.1.5
  intl: ^0.20.2
  url_launcher: ^6.3.2
  image_picker: ^1.2.3
  image: ^4.5.4
  package_info_plus: ^10.2.1
  share_plus: ^13.3.0
  path_provider: ^2.1.6

  # Writing the farm's books into the Google Sheet, straight from the phone.
  http: ^1.6.0

  # A statement anybody can be handed: real text on a real page, not a
  # photograph of a screen. The printing package is deliberately not here —
  # the file is made and then shared like any other, which is what a phone
  # does with it anyway.
  pdf: ^3.11.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/logo.png
    - assets/mark.png

  fonts:
    - family: Barlow
      fonts:
        - asset: assets/fonts/Barlow-Regular.ttf
          weight: 400
        - asset: assets/fonts/Barlow-Medium.ttf
          weight: 500
        - asset: assets/fonts/Barlow-SemiBold.ttf
          weight: 600
    - family: BarlowCondensed
      fonts:
        - asset: assets/fonts/BarlowCondensed-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/BarlowCondensed-Bold.ttf
          weight: 700
